name: catalog-validate

on:
  push:
    branches: [main]
    paths: ["data/**", "examples/**", "scripts/**", "tests/**", ".github/workflows/catalog-validate.yml"]
  pull_request:
    paths: ["data/**", "examples/**", "scripts/**", "tests/**", ".github/workflows/catalog-validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generator sync check (data/catalog.json matches models.json + aliases.json)
        run: python3 scripts/generate_catalog.py --check
      - name: Schema rules (uniqueness, vocabulary, dates, bare-word stability)
        run: python3 scripts/validate_catalog.py
      - name: Local model schema rules
        run: python3 scripts/validate_local_models.py
      - name: Compatibility and local-runtime tests
        run: python3 -m unittest discover -s tests -v
      - name: Reference consumers enforce the shared contract
        run: |
          python3 examples/python/model_catalog.py
          cargo run --quiet --manifest-path examples/rust/Cargo.toml
          npx --yes tsx examples/typescript/demo.ts
      - name: Renderer runs clean and emits exactly the openrouter rows
        run: |
          out="$(python3 scripts/render_openrouter.py)"
          echo "$out"
          want="$(python3 -c 'import json; print(sum(1 for r in json.load(open("data/catalog.json"))["aliases"] if r["target"]=="openrouter"))')"
          got="$(echo "$out" | grep -c '^[a-z0-9].*: ' || true)"
          [ "$got" = "$want" ] || { echo "renderer emitted $got rows, catalog has $want"; exit 1; }
      - name: Catalog changes require a version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 scripts/check_version_bump.py --base-ref "origin/${{ github.base_ref }}" --path data/catalog.json
      - name: Local catalog changes require a version and date bump
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_version_bump.py --base-ref "origin/${{ github.base_ref }}" --path data/local-models.json --initial-version 1.0.0
