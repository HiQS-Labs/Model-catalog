name: catalog-verify

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provider verification probe
        run: |
          python3 scripts/verify_providers.py --output report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
